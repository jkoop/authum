name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Set up Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Test
        run: zig build test
